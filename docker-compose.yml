version: '3.8'

services:
  # MinIO S3 Emulator Service
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: authpole-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # MinIO S3 API Endpoint
      - "9001:9001" # MinIO Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Oneshot MinIO Bucket Initializer
  create-bucket:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: authpole-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/authpole-storage --ignore-existing;
      /usr/bin/mc version enable myminio/authpole-storage;
      echo 'Bucket authpole-storage initialized with versioning enabled.';
      exit 0;
      "

  # Authpole Mediator IDP & SPIFFE Server
  authpole:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authpole-server
    command: ["/app/authpole", "-port=8080", "-s3-bucket=authpole-storage", "-s3-endpoint=http://minio:9000"]
    environment:
      PORT: "8080"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "8080:8080"
    depends_on:
      create-bucket:
        condition: service_completed_successfully

  # Standalone Admin Console UI (Nginx Static Host)
  admin-ui:
    image: nginx:alpine
    container_name: authpole-admin-ui
    ports:
      - "3000:80"
    volumes:
      - ./web/admin:/usr/share/nginx/html:ro

volumes:
  minio_data:
